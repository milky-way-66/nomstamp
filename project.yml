name: FoodMap
options:
  bundleIdPrefix: com.longnv
  developmentLanguage: en
  # Vietnamese is a target-market requirement (NFR-5.1), not an afterthought.
  knownRegions: [en, vi, Base]
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  FoodMapDesign:
    path: Packages/FoodMapDesign
  FoodMapDomain:
    path: Packages/FoodMapDomain
  FoodMapData:
    path: Packages/FoodMapData
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "8"
  # Simulator builds and the test suites need no developer account; a Release archive for
  # TestFlight must be signed. See docs/deployment/testflight.md.
  # Scoped to the simulator, not to Debug as a whole. Unscoped, these two switch signing off for
  # every Debug build including one aimed at a phone, which is how a Debug build for a device fails
  # to install — and a device is the only place the connect ceremony can be tested at all
  # (docs/testing/radio-check.md).
  configs:
    Debug:
      "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": NO
      "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
targets:
  FoodMap:
    type: application
    platform: iOS
    sources:
      - path: FoodMap
    dependencies:
      - package: FoodMapDesign
      - package: FoodMapDomain
      - package: FoodMapData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.longnv.foodmap.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nomstamp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Nothing beyond Apple's own encryption, so App Store Connect never has to ask.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Fill in your ten-character Team ID before archiving (developer.apple.com/account).
        # DEVELOPMENT_TEAM: ABCDE12345
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # iPhone only, portrait only (SRS 2.3)
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Nomstamp uses the camera so you can photograph the food you are eating."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Nomstamp reads photos you choose so you can log meals you photographed earlier."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Nomstamp uses your location to find the restaurant you are in and to show saved places near you."
        # Without this key CoreBluetooth is refused outright — and iOS terminates the app the
        # moment it needs to ask. It is the whole in-person connect ceremony (FR-10.2, FR-10.10).
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Nomstamp uses Bluetooth to find a friend's phone in the same room, which is the only way friends can be added."

  FoodMapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FoodMapUITests
    dependencies:
      - target: FoodMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.longnv.foodmap.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FoodMap:
    build:
      targets:
        FoodMap: all
        FoodMapUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FoodMapUITests
